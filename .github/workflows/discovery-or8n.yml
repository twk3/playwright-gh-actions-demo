name: discovery-or8n

on:
  push:

jobs:
  test-or8n:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    timeout-minutes: 60
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.61.0-noble
    env:
      CURRENTS_API_URL: https://cy-staging.currents.dev
      CURRENTS_PROJECT_ID: kTvs8s
      CURRENTS_RECORD_KEY: ${{ secrets.STAGING_CURRENTS_RECORD_KEY }}
      CURRENTS_CI_BUILD_ID: ${{ github.repository }}-${{ github.run_id }}-${{ github.run_attempt }}
      CURRENTS_API_KEY: ${{ secrets.STAGING_CURRENTS_API_KEY }}
      CURRENTS_DISCOVERY_FILE: .currents/discovery.txt
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      # https://github.com/actions/runner-images/issues/6775
      - run: |
          echo "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"

      - name: Install dependencies
        run: |
          npm ci
          npx playwright install chrome

      - name: Playwright Tests
        working-directory: ./basic
        run: |
          echo "Running discovery"
          npx pwc-p discover --project "Project A" --grep @basic
          echo "Running tests"
          npx pwc-p run --project "Project A"
